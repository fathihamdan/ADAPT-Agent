[project]
name = "adapt-agent"
version = "0.1.0"
description = "ADAPT-Agent: Airline Disruption Analysis & Prevention Technology (CLI prototype)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[project.scripts]
adapt = "adapt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapt*"]
